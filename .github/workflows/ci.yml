name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pdfjs-dist (optional dep behind get_fulltext page extraction) is pinned to 5.6.205,
        # the last release that runs on Node 20.19, which is why 20 is still here (#69).
        # tests/node-floor.test.ts fails if that pin, the lockfile and this matrix drift apart.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The build project excludes tests, so the step above never sees them. This one does.
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm run build
      # The Codex bindings under codex/ are generated from the tool definitions. A tool edit
      # that forgets `npm run gen:codex` ships stale wrappers; this makes it a red run instead.
      - run: npm run gen:codex && git diff --exit-code -- codex/
      # Unit + integration tests. The live e2e suite self-skips without ZOTERO_API_KEY.
      - run: npm test
