name: Release image

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm run build
      - run: npm test

  image:
    needs: test          # green test gate guards the publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3   # arm64 emulation for the multi-arch build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # x86 (E2.1.Micro) + ARM (Ampere A1) — both Always-Free shapes
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm-publish:
    needs: test                      # green gate guards the publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                # OIDC: npm trusted publishing, and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (the package trusts oscardvs/zoteus deploy.yml on npmjs.com) needs
      # npm 11.5.1 or newer, and Node 22 bundles npm 10. It replaces the NPM_TOKEN secret: npm
      # is retiring publish rights for tokens that bypass 2FA (targeted January 2027), and the
      # granular token also had to be re-minted every 90 days.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      # publishConfig.access=public; provenance comes with trusted publishing. prepublishOnly
      # re-runs build, and prepack writes the npm-shrinkwrap.json the package ships.
      # Idempotent: skip (don't fail) if this version is already on the registry, so a prior
      # manual publish or a re-pushed tag still lets the `release` job attach the bundles.
      - name: Publish to npm (skip if version already published)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@oscardvs/zoteus@${VERSION}" version >/dev/null 2>&1; then
            echo "@oscardvs/zoteus@${VERSION} already on npm, skipping publish."
          else
            npm publish --provenance
          fi

  release:
    needs: [test, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write                # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # One SELF-CONTAINED .mcpb (MCP Bundle) per operating system: manifest + icon + built
      # dist + bundled production deps. Packing mcpb/ alone would omit dist/ and node_modules
      # and yield a broken bundle, so a complete tree is staged first. Per OS because pdfjs-dist
      # needs @napi-rs/canvas, whose skia binary is a separate npm package per OS and CPU that
      # npm installs only for the host: a plain `npm ci` on this Linux runner packed linux-x64
      # binaries under a manifest promising darwin and win32 (#62). scripts/mcpb-bundle.ts
      # stages each tree with `npm ci --os --cpu` from the lockfile (both CPUs of the OS,
      # nothing hardcoded), narrows the manifest to that OS, validates and packs.
      - name: Build one self-contained .mcpb per platform
        run: |
          npx tsx scripts/mcpb-bundle.ts build darwin
          npx tsx scripts/mcpb-bundle.ts build win32
          npx tsx scripts/mcpb-bundle.ts build linux
      # The gate: list each archive and fail the release unless it carries a .node binary for
      # every CPU of the OS its manifest names, the entry point, pdfjs and the canvas loader,
      # and nothing built for another OS.
      - name: Verify each bundle carries its platform's native PDF dependency
        run: |
          npx tsx scripts/mcpb-bundle.ts check zoteus-macos.mcpb darwin
          npx tsx scripts/mcpb-bundle.ts check zoteus-windows.mcpb win32
          npx tsx scripts/mcpb-bundle.ts check zoteus-linux.mcpb linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zoteus-macos.mcpb
            zoteus-windows.mcpb
            zoteus-linux.mcpb
          generate_release_notes: true
